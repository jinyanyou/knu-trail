
name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            --retry 2 \
            --retry-delay 10 \
            https://knu-trail.onrender.com/api/meta
